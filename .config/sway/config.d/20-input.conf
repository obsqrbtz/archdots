# Input
# Devices: swaymsg -t get_inputs

input "6700:5378:SHINETEK_RGB_Gaming_KB_89_Keyboard" {
    xkb_layout "us,ru"
    xkb_options "grp:win_space_toggle"
}

input * {
    xkb_layout "us"
}

# This keyboard exposes two evdev interfaces and reports every modifier
# on BOTH. Only the "..._KB_89" one sends ordinary keys, so the layout
# toggle lives there; the "..._Keyboard" one stays plain US and can no
# longer double-fire ISO_Next_Group.
input "6700:5378:SHINETEK_RGB_Gaming_KB_89" {
    xkb_layout "us,ru"
    xkb_options "grp:alt_shift_toggle"
}

focus_follows_mouse yes
mouse_warping output
focus_on_window_activation focus
