# Keybinds
# A "#: description" line ABOVE a bind feeds $mod+C (scripts/cheatsheet.sh)

### Applications
#: terminal
bindsym $mod+Return exec $term
#: file manager
bindsym $mod+e exec $filemanager
#: application launcher
bindsym $mod+d exec $menu
#: run command
bindsym $mod+Shift+d exec rofi -show run
#: window switcher
bindsym $mod+Tab exec rofi -show window
#: clipboard history
bindsym $mod+v exec $scripts/clip.sh
#: wallpaper picker
bindsym $mod+w exec $scripts/wallpaper.sh pick
#: this cheatsheet
bindsym $mod+c exec $scripts/cheatsheet.sh

### Session
#: close window
bindsym $mod+q kill
#: power menu
bindsym $mod+Shift+q exec $scripts/powermenu.sh
#: reload sway config
bindsym $mod+Shift+c exec swaymsg reload
#: exit sway
bindsym $mod+m exec swaynag -t warning -m 'Exit sway?' -B 'Exit' 'swaymsg exit'

### Layout
#: fullscreen
bindsym $mod+f fullscreen toggle
#: floating toggle
bindsym $mod+Shift+space floating toggle
#: focus tiling/floating
bindsym $mod+space focus mode_toggle
#: toggle split direction
bindsym $mod+Shift+t layout toggle split
#: stacking layout
bindsym $mod+s layout stacking
#: tabbed layout
bindsym $mod+t layout tabbed
#: pin window (sticky)
bindsym $mod+p sticky toggle
#: focus parent container
bindsym $mod+a focus parent
#: focus child container
bindsym $mod+Shift+a focus child

### Focus
#: focus left
bindsym $mod+$left focus left
#: focus down
bindsym $mod+$down focus down
#: focus up
bindsym $mod+$up focus up
#: focus right
bindsym $mod+$right focus right

### Move
#: move window left
bindsym $mod+Shift+$left move left
#: move window down
bindsym $mod+Shift+$down move down
#: move window up
bindsym $mod+Shift+$up move up
#: move window right
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

### Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Scroll over anything with the mod held to cycle workspaces
#: next workspace
bindsym --whole-window $mod+button5 workspace next_on_output
#: previous workspace
bindsym --whole-window $mod+button4 workspace prev_on_output

### Scratchpad (was Hyprland's special:magic workspace)
#: toggle scratchpad
bindsym $mod+o scratchpad show
#: send to scratchpad
bindsym $mod+Shift+s move scratchpad

### Screenshots -- grim + slurp (flameshot still runs in the tray)
#: screenshot: whole output
bindsym Print exec $scripts/screenshot.sh screen
#: screenshot: region
bindsym Shift+Print exec $scripts/screenshot.sh region
#: screenshot: focused window
bindsym Ctrl+Print exec $scripts/screenshot.sh window

### Notifications
#: last notification
bindsym $mod+n exec dunstctl history-pop
#: dismiss notifications
bindsym $mod+Shift+n exec dunstctl close-all

### Media keys
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec brightnessctl -e4 -n2 set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl -e4 -n2 set 5%-
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause

### Mouse: drag with $mod+LMB, resize with $mod+RMB
floating_modifier $mod normal

### Resize mode
mode "resize" {
    bindsym $left resize shrink width 30px
    bindsym $down resize grow height 30px
    bindsym $up resize shrink height 30px
    bindsym $right resize grow width 30px

    bindsym Left resize shrink width 30px
    bindsym Down resize grow height 30px
    bindsym Up resize shrink height 30px
    bindsym Right resize grow width 30px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
#: resize mode
bindsym $mod+r mode "resize"
