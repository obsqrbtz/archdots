# Color palette sync -- generated by clrsync, do not edit.
# Drop-in loaded after dunstrc, so it overrides the colors set there.
# Colors only -- geometry, timeouts and behaviour stay in dunstrc.

[global]
    frame_color = "#242424"
    separator_color = frame
    highlight = "#9A8652"

[urgency_low]
    background = "#111111"
    foreground = "#849899"
    frame_color = "#242424"

[urgency_normal]
    background = "#111111"
    foreground = "#D2D2D2"
    frame_color = "#242424"

[urgency_critical]
    background = "#111111"
    foreground = "#D2D2D2"
    frame_color = "#AA4E4A"
